<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SIM GURU - Sistem Informasi Manajemen & Absensi</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="shim.js"></script>
  <style>
    :root {
      --navy: #0f172a;
      --navy-light: #1e293b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Layout & Sidebar */
    #appWrapper {
      display: flex;
      min-height: 100vh;
    }

    sidebar {
      width: 260px;
      background-color: var(--navy);
      color: #fff;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 1000;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .sidebar-brand {
      padding: 24px 20px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-brand span {
      color: var(--accent-orange);
    }

    .sidebar-menu {
      padding: 20px 12px;
      list-style: none;
      margin: 0;
      flex-grow: 1;
      overflow-y: auto;
    }

    .sidebar-menu li {
      margin-bottom: 6px;
    }

    .sidebar-menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: #94a3b8;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .sidebar-menu a:hover, .sidebar-menu a.active {
      color: #fff;
      background-color: rgba(255,255,255,0.08);
    }

    .sidebar-menu a.active {
      background-color: var(--accent-blue);
      color: #fff;
    }

    .main-content {
      margin-left: 260px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top Navbar */
    .top-navbar {
      height: 70px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    /* Cards & Container */
    .card-modern {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
      padding: 24px;
      margin-bottom: 24px;
      transition: transform 0.2s ease;
    }

    .stat-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
    }

    .stat-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    /* Buttons */
    .btn-custom-primary {
      background-color: var(--navy);
      color: #fff;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 500;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-custom-primary:hover {
      background-color: var(--navy-light);
      color: #fff;
    }

    .btn-accent-gold {
      background-color: var(--accent-orange);
      color: var(--navy);
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 600;
      border: none;
    }
    .btn-accent-gold:hover {
      background-color: #d97706;
      color: #fff;
    }

    /* Form Controls */
    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    /* Tables */
    .table-modern {
      width: 100%;
      margin-bottom: 0;
      white-space: nowrap;
    }
    .table-modern th {
      font-weight: 600;
      color: var(--text-muted);
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .table-modern td {
      padding: 16px;
      vertical-align: middle;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    /* Badges */
    .badge-status {
      padding: 6px 12px;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.75rem;
    }
    .badge-hadir { background-color: rgba(16, 185, 129, 0.12); color: var(--accent-green); }
    .badge-terlambat { background-color: rgba(245, 158, 11, 0.12); color: var(--accent-orange); }
    .badge-tidak { background-color: rgba(239, 68, 68, 0.12); color: var(--accent-red); }

    /* Sections view handler */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Mobile Bottom Navbar */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 10px 16px;
      z-index: 1000;
      justify-content: space-around;
      align-items: center;
    }
    .mobile-bottom-nav a {
      color: var(--text-muted);
      text-align: center;
      text-decoration: none;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .mobile-bottom-nav a.active {
      color: var(--accent-blue);
    }
    .mobile-bottom-nav a i {
      font-size: 1.2rem;
    }

    /* Responsive adjustments */
    @media (max-width: 991.98px) {
      sidebar { transform: translateX(-100%); }
      sidebar.mobile-open { transform: translateX(0); }
      .main-content { margin-left: 0; padding-bottom: 70px; }
      .mobile-bottom-nav { display: flex; }
      .top-navbar { padding: 0 16px; }
    }

    /* Auth Full Layout */
    #authWrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 20px;
    }

    .lembaga-toggle {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .lembaga-toggle .btn-check + label {
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
    }
    .payroll-tabs .btn {
      border-radius: 10px;
      font-weight: 600;
    }
    .mdt-summary {
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      background: #f8fafc;
    }

    /* Print Styles untuk Cetak Slip Gaji */
    @media print {
      body * { visibility: hidden; }
      #modalSlipGaji, #modalSlipGaji * { visibility: visible; }
      #modalRekapGajiSemua, #modalRekapGajiSemua * { visibility: visible; }
      #modalSlipGaji {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      #modalRekapGajiSemua {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      .modal-dialog {
        max-width: 100%;
        margin: 0;
      }
      .modal-content {
        border: none;
        box-shadow: none;
      }
      /* TAMBAHAN: perbaikan cetak Rekapitulasi Gaji Seluruh Guru di layar sempit (HP).
         table-responsive membuat scroll horizontal di layar kecil; saat print, bagian
         yang perlu di-scroll itu tidak ikut tercetak. Aturan ini memaksa tabel tampil
         penuh (tidak terpotong) khusus untuk modal rekapitulasi ini saja. */
      #modalRekapGajiSemua .modal-body {
        padding: 10px !important;
        width: 100% !important;
        max-width: none !important;
      }
      #modalRekapGajiSemua .table-responsive {
        overflow-x: visible !important;
        width: 100% !important;
      }
      #modalRekapGajiSemua table {
        width: 100% !important;
        table-layout: fixed !important;
        font-size: 9px !important;
      }
      #modalRekapGajiSemua th,
      #modalRekapGajiSemua td {
        padding: 3px 2px !important;
        word-break: break-word;
      }
      .d-print-none { display: none !important; }
    }

    /* ===== Pengaturan & Manajemen Akun ===== */
    .setting-card { border:1px solid var(--border-color); border-radius:16px; background:#fff; height:100%; }
    .setting-icon { width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
    .account-table th { white-space:nowrap; font-size:.78rem; color:#64748b; text-transform:uppercase; }
    .account-table td { vertical-align:middle; }
    .role-pill { padding:.35rem .65rem; border-radius:999px; font-size:.75rem; font-weight:600; display:inline-block; }
    .role-admin { background:#fee2e2; color:#b91c1c; }
    .role-guru { background:#dbeafe; color:#1d4ed8; }
    .role-kepala { background:#ede9fe; color:#6d28d9; }
    .role-bendahara { background:#d1fae5; color:#047857; }
    .permission-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .permission-item { border:1px solid var(--border-color); border-radius:10px; padding:10px 12px; background:#f8fafc; }
    @media(max-width:576px){ .permission-grid{grid-template-columns:1fr;} }

    /* ===== Dashboard Guru (Rich) ===== */
    .quick-access-card { border:1px solid var(--border-color); border-radius:16px; background:#fff; padding:18px; height:100%; cursor:pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .quick-access-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px -4px rgba(0,0,0,0.08); }
    .quick-access-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; margin-bottom:10px; }
    .kelengkapan-item { border:1px solid var(--border-color); border-radius:12px; padding:14px 10px; background:#f8fafc; height:100%; }
  </style>
</head>
<body>
<script>
// Menampilkan galat JavaScript sebagai banner merah di bawah layar (agar penyebab layar kosong terlihat tanpa DevTools).
(function () {
  function tampil(pesan) {
    try {
      var b = document.getElementById('bannerGalat');
      if (!b) {
        b = document.createElement('div');
        b.id = 'bannerGalat';
        b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b91c1c;color:#fff;font:12px/1.4 monospace;padding:8px 36px 8px 12px;max-height:35vh;overflow:auto;white-space:pre-wrap;word-break:break-word;';
        var x = document.createElement('span');
        x.textContent = '\u00d7';
        x.style.cssText = 'position:absolute;right:12px;top:2px;font-size:22px;cursor:pointer;';
        x.onclick = function () { b.remove(); };
        b.appendChild(x);
        var isi = document.createElement('div');
        isi.id = 'bannerGalatIsi';
        b.appendChild(isi);
        (document.body || document.documentElement).appendChild(b);
      }
      var el = document.getElementById('bannerGalatIsi');
      if (el && el.textContent.length < 1500) el.textContent += (el.textContent ? '\n' : '') + pesan;
    } catch (e) { /* abaikan */ }
  }
  window.addEventListener('error', function (e) {
    var m = String(e.message || '');
    if (!m || /^Script error\.?$/.test(m) || /ResizeObserver/.test(m)) return;
    tampil('Galat: ' + m + ' (baris ' + (e.lineno || '?') + ') [build 2026-11-07-d]');
    if (/SyntaxError|Invalid or unexpected token|Unexpected (token|end|identifier|string|number)|missing \)|Unterminated/.test(m)) tampilBarisSkrip(e.lineno);
  });
  // Untuk galat sintaks: tampilkan isi baris itu persis seperti yang diterima browser.
  function tampilBarisSkrip(n) {
    try {
      var ss = document.getElementsByTagName('script'), terbaik = null, maks = 0;
      for (var i = 0; i < ss.length; i++) {
        var t = ss[i].textContent || '';
        var jml = t.split(/\r\n|\r|\n/).length;
        if (!ss[i].src && jml >= n && jml > maks) { maks = jml; terbaik = t; }
      }
      if (!terbaik) return;
      var baris = terbaik.split(/\r\n|\r|\n/);
      var cuplikan = baris[n - 1] || '';
      var aneh = [];
      for (var k = 0; k < cuplikan.length; k++) {
        var c = cuplikan.charCodeAt(k);
        if (c > 126 || (c < 32 && c !== 9)) aneh.push(k + ':U+' + c.toString(16));
      }
      tampil('Isi baris ' + n + ': ' + JSON.stringify(cuplikan.slice(0, 180)) + (aneh.length ? ' | karakter aneh: ' + aneh.slice(0, 6).join(',') : '') +
        ' | jumlah baris skrip: ' + maks + ' | baris-1: ' + JSON.stringify((baris[n - 2] || '').slice(0, 120)));
    } catch (x) { /* abaikan */ }
  }
  // Jika skrip utama gagal dimuat, jangan biarkan form login terkirim ke halaman kosong.
  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'loginForm' && typeof window.handleLogin !== 'function') {
      e.preventDefault();
      tampil('Skrip utama aplikasi gagal dimuat, jadi login dinonaktifkan sementara. Lihat galat di atas.');
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    tampil('Galat: ' + String((r && r.message) || r));
  });
})();
</script>


  <!-- AUTH SECTION (LOGIN & REGISTRASI) -->
  <div id="authWrapper">
    <!-- Login Card -->
    <div id="loginCard" class="card-modern col-12 col-md-5 col-lg-4 p-4 p-md-5" style="background: var(--card-bg);">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-navy" style="color: var(--navy);">SIM GURU</h3>
        <p class="text-muted small">Sistem Informasi Manajemen & Absensi Terpadu</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label small fw-bold">Username / NIK</label>
          <input type="text" class="form-control" id="loginUser" required placeholder="Masukkan NIK atau username" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold">Password</label>
          <input type="password" class="form-control" id="loginPass" required placeholder="Masukkan kata sandi">
        </div>
        <button type="submit" class="btn btn-accent-gold w-100 py-3 mb-3" id="btnLogin">Masuk Aplikasi</button>
      </form>
      <div class="text-center mt-3">
        <span class="text-muted small">Belum terdaftar? </span>
        <a href="javascript:void(0);" onclick="switchAuthView('register')" class="text-decoration-none fw-bold text-primary">Registrasi Guru Baru</a>
      </div>
    </div>

    <!-- Register Card -->
    <div id="registerCard" class="card-modern col-12 col-lg-8 p-4 p-md-5" style="display: none; background: var(--card-bg); max-height: 90vh; overflow-y: auto;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 class="fw-bold m-0" style="color: var(--navy);">Registrasi Biodata Guru</h4>
          <p class="text-muted small m-0">Lengkapi formulir di bawah ini dengan benar</p>
        </div>
        <button class="btn btn-outline-secondary btn-sm rounded-circle" onclick="switchAuthView('login')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="guruForm" onsubmit="submitForm(event)">
        <!-- Bagian A: Data Pribadi -->
        <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-user me-2"></i>A. Data Pribadi</h6>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-bold">Nama Lengkap (Gelar)</label>
            <input type="text" class="form-control" name="nama" required placeholder="Contoh: Budi Santoso, S.Pd">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-bold">NIK (16 Digit)</label>
            <input type="number" class="form-control" name="nik" required placeholder="Nomor Induk Kependudukan">
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-bold">Tempat Lahir</label>
            <input type="text" class="form-control" name="tempat_lahir" required placeholder="Kota kelahiran">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-bold">Tanggal Lahir</label>
            <input type="date" class="form-control" name="tanggal_lahir" required>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-bold">Jenis Kelamin</label>
            <select class="form-select" name="jk" required>
              <option value="">-- Pilih Jenis Kelamin --</option>
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-bold">Status Perkawinan</label>
            <select class="form-select" name="status_kawin" required>
              <option value="">-- Pilih Status --</option>
              <option value="Belum Kawin">Belum Kawin</option>
              <option value="Kawin">Kawin</option>
              <option value="Cerai">Cerai</option>
            </select>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold">Nama Ibu Kandung</label>
          <input type="text" class="form-control" name="nama_ibu" required placeholder="Nama lengkap ibu kandung">
        </div>

        <!-- Bagian B: Alamat -->
        <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-location-dot me-2"></i>B. Alamat Domisili</h6>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-bold">RT</label>
            <input type="number" class="form-control" name="rt" required placeholder="001">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-bold">RW</label>
            <input type="number" class="form-control" name="rw" required placeholder="001">
          </div>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label small fw-bold">Kabupaten/Kota</label>
            <select class="form-select" name="kabupaten" id="kabupaten" onchange="loadKecamatan()" required>
              <option value="">-- Pilih Kabupaten --</option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label small fw-bold">Kecamatan</label>
            <select class="form-select" name="kecamatan" id="kecamatan" onchange="loadDesa()" required disabled>
              <option value="">-- P
